<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link
        href="https://fonts.googleapis.com/css?family=Montserrat:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="app-container">
        <h1 class="title">Age Calculator</h1>
        <div class="date-container">
            <p>Enter your date of birth</p>
            <input type="date" class="date-input" min="1900-01-01" max="2026-12-31">
            <button class="calculate-btn">Calculate Age</button>
        </div>
        <div class="result">
            <p class="age-result">Your are <span class="your-age"></span> years old</p>
        </div>
    </div>
</body>

</html>
